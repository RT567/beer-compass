<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9cf55">
<meta name="description" content="Points at the nearest place you can buy a beer right now.">
<title>Beer Compass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 6 82 90 50 72 18 90z'/%3E%3C/svg%3E">
<style>
html,body{height:100%;margin:0}
body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;background:#e9a522;color:#fff;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#beer{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
h1{font-size:28px;text-shadow:0 1px 3px rgba(110,50,0,.45);margin:max(24px,env(safe-area-inset-top)) 0 0}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
#arrow{width:min(70vw,50vh);height:min(70vw,50vh);transition:opacity .3s;fill:#fff;filter:drop-shadow(0 2px 6px rgba(110,50,0,.45))}
#arrow.idle{opacity:.3}
#status{position:fixed;bottom:40px;left:0;right:0;color:#666;font-size:14px;text-align:center;padding:0 16px}
footer{font-size:9px;color:rgba(255,255,255,.55);margin-bottom:max(8px,env(safe-area-inset-bottom))}
footer a{color:inherit}
</style>
<canvas id="beer" aria-hidden="true"></canvas>
<h1>Beer Compass</h1>
<main>
  <svg id="arrow" class="idle" viewBox="0 0 100 100" aria-label="arrow pointing at the nearest open bar, pub or bottle shop">
    <path d="M50 6 82 90 50 72 18 90z"/>
  </svg>
</main>
<footer>pubs &amp; bottle shops &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></footer>
<script src="beer.js"></script>
<script src="hours.js"></script>
<script src="app.js"></script>
<script src="idiot.js"></script>
</html>
