<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9cf55">
<meta name="description" content="Points at the nearest place you can buy a beer right now.">
<title>Beer Compass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 6 82 90 50 72 18 90z'/%3E%3C/svg%3E">
<style>
html,body{height:100%;margin:0}
body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;background:#e9a522;color:#fff;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#beer{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
#arrow{width:min(70vw,50vh);height:min(70vw,50vh);transition:opacity .3s;fill:#fff;stroke:#fff;
  filter:drop-shadow(0 1px 4px rgba(110,50,0,.3))}
/* three styles, picked with ?arrow=needle|soft|line (default needle) */
#arrow g{display:none}
#arrow:not([data-style]) .needle,#arrow[data-style=needle] .needle,#arrow[data-style=soft] .soft,#arrow[data-style=line] .line{display:inline}
#arrow.idle{opacity:.3}
#status{position:fixed;bottom:40px;left:0;right:0;color:#666;font-size:14px;text-align:center;padding:0 16px}
</style>
<canvas id="beer" aria-hidden="true"></canvas>
<main>
  <svg id="arrow" class="idle" viewBox="0 0 100 100" aria-label="arrow pointing at the nearest open bar, pub or bottle shop">
    <!-- needle: a slim compass needle, the bright end points at the beer -->
    <g class="needle" stroke-width="2.5" stroke-linejoin="round">
      <path d="M50 8 58 50H42z"/>
      <path d="M42 50H58L50 92z" opacity=".3"/>
      <circle cx="50" cy="50" r="2.4" fill="#d9921a" stroke="none"/>
    </g>
    <!-- soft: the original arrowhead, slimmer, with rounded corners -->
    <g class="soft" stroke-width="9" stroke-linejoin="round">
      <path d="M50 14 75 84 50 70 25 84z"/>
    </g>
    <!-- line: a plain line arrow with round ends -->
    <g class="line" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 88V14M28 36 50 14 72 36"/>
    </g>
  </svg>
</main>
<!-- Venue data © OpenStreetMap contributors, ODbL: https://www.openstreetmap.org/copyright -->
<script src="beer.js"></script>
<script src="hours.js"></script>
<script src="app.js"></script>
<script src="idiot.js"></script>
</html>
